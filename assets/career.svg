<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Career line: 2020 B.Tech, 2024 intern at Tezo, 2024 full stack developer on Keka, 2024 employee of the month, 2025 GenAI developer on Habasit, April 2026 Engineer 1 at Ryan LLC.">
  <title>Career line</title>

  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace; }
    </style>

    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D6E67" />
      <stop offset="35%" stop-color="#4FA396" />
      <stop offset="72%" stop-color="#B8894A" />
      <stop offset="100%" stop-color="#E0A44C" />
    </linearGradient>

    <clipPath id="card2">
      <rect x="0.5" y="0.5" width="1199" height="299" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#card2)">
    <rect width="1200" height="300" fill="#0A0D12" />

    <text class="mono" x="40" y="42" fill="#5C677B" font-size="10.5" letter-spacing="2.6">CAREER LINE</text>

    <g class="mono" font-size="10" letter-spacing="1.4">
      <circle cx="988" cy="38" r="3.5" fill="#4FA396" />
      <text x="1000" y="42" fill="#5C677B">STUDY / EARLY</text>
      <circle cx="1104" cy="38" r="3.5" fill="#E0A44C" />
      <text x="1116" y="42" fill="#5C677B">NOW</text>
    </g>

    <!-- route -->
    <rect x="90" y="168" width="1020" height="3" rx="1.5" fill="url(#route)" />

    <!-- travelling service -->
    <g>
      <circle cy="169.5" r="9" fill="#E0A44C" opacity="0.14">
        <animate attributeName="cx" values="90;1110;1110" keyTimes="0;0.82;1" dur="11s" repeatCount="indefinite" />
      </circle>
      <circle cy="169.5" r="3.5" fill="#F0C078">
        <animate attributeName="cx" values="90;1110;1110" keyTimes="0;0.82;1" dur="11s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- ticks -->
    <g stroke="#26324A" stroke-width="1">
      <path d="M90 178v16" />
      <path d="M294 146v16" />
      <path d="M498 178v16" />
      <path d="M702 146v16" />
      <path d="M906 178v16" />
      <path d="M1110 146v16" />
    </g>

    <!-- station 1 · below -->
    <g class="mono">
      <text x="90" y="212" fill="#E0A44C" font-size="11" letter-spacing="1.8">2020</text>
      <text x="90" y="234" fill="#E8E6E1" font-size="14">B.Tech</text>
      <text x="90" y="253" fill="#7C8698" font-size="11.5">Rungta CET</text>
    </g>

    <!-- station 2 · above -->
    <g class="mono" text-anchor="middle">
      <text x="294" y="102" fill="#E0A44C" font-size="11" letter-spacing="1.8">2024 · JAN</text>
      <text x="294" y="124" fill="#E8E6E1" font-size="14">Intern</text>
      <text x="294" y="143" fill="#7C8698" font-size="11.5">Tezo · Angular, .NET</text>
    </g>

    <!-- station 3 · below -->
    <g class="mono" text-anchor="middle">
      <text x="498" y="212" fill="#E0A44C" font-size="11" letter-spacing="1.8">2024 · JUL</text>
      <text x="498" y="234" fill="#E8E6E1" font-size="14">Full Stack Developer</text>
      <text x="498" y="253" fill="#7C8698" font-size="11.5">Tezo · Keka HRMS</text>
    </g>

    <!-- station 4 · above -->
    <g class="mono" text-anchor="middle">
      <text x="702" y="102" fill="#E0A44C" font-size="11" letter-spacing="1.8">2024 · OCT</text>
      <text x="702" y="124" fill="#E8E6E1" font-size="14">Employee of the Month</text>
      <text x="702" y="143" fill="#7C8698" font-size="11.5">Tezo</text>
    </g>

    <!-- station 5 · below -->
    <g class="mono" text-anchor="middle">
      <text x="906" y="212" fill="#E0A44C" font-size="11" letter-spacing="1.8">2025 · OCT</text>
      <text x="906" y="234" fill="#E8E6E1" font-size="14">Full Stack + GenAI</text>
      <text x="906" y="253" fill="#7C8698" font-size="11.5">Tezo · Habasit</text>
    </g>

    <!-- station 6 · above -->
    <g class="mono" text-anchor="end">
      <text x="1110" y="102" fill="#E0A44C" font-size="11" letter-spacing="1.8">2026 · APR</text>
      <text x="1110" y="124" fill="#E8E6E1" font-size="14">Engineer 1</text>
      <text x="1110" y="143" fill="#7C8698" font-size="11.5">Ryan, LLC · Tracker Pro</text>
    </g>

    <!-- markers -->
    <g fill="#0A0D12">
      <circle cx="90" cy="169.5" r="7" stroke="#4FA396" stroke-width="2" />
      <circle cx="294" cy="169.5" r="7" stroke="#4FA396" stroke-width="2" />
      <circle cx="498" cy="169.5" r="7" stroke="#6E9A78" stroke-width="2" />
      <circle cx="906" cy="169.5" r="7" stroke="#B8894A" stroke-width="2" />
    </g>

    <!-- award marker -->
    <g transform="translate(702 169.5)">
      <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="#0A0D12" stroke="#E0A44C" stroke-width="2" />
      <rect x="-2.5" y="-2.5" width="5" height="5" transform="rotate(45)" fill="#E0A44C" />
    </g>

    <!-- current marker -->
    <g transform="translate(1110 169.5)">
      <circle r="9" fill="none" stroke="#E0A44C" stroke-width="1.5" opacity="0.6">
        <animate attributeName="r" values="9;17;17" keyTimes="0;0.7;1" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0;0" keyTimes="0;0.7;1" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle r="8" fill="#E0A44C" />
      <circle r="3" fill="#0A0D12" />
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="10" fill="none" stroke="#1B2432" />
  </g>
</svg>
