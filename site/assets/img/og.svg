<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Arpit Mishra — Software Engineer. Engineer 1 at Ryan, LLC on the Owner Claims Portal in Tracker Pro.">
